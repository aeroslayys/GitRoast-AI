name: Browser smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only browser tooling
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local app
        run: |
          npm start > /tmp/gitroast-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/gitroast-server.log
          exit 1
      - name: Test desktop and mobile interactions
        run: npx playwright test --config=playwright.config.cjs
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-failures
          path: |
            test-results/
            /tmp/gitroast-server.log
          if-no-files-found: ignore
